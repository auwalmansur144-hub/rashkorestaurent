<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Menu — Rashko Restaurant, Kano</title>
  <meta name="description" content="Mezze, slow-cooked mandi & kabsa, charcoal kebabs, and traditional Arabic desserts. The full Rashko menu, served daily in Kano.">
  <meta property="og:title" content="Menu — Rashko Restaurant">
  <meta property="og:description" content="Mezze, mandi, kabsa, kebabs and Arabic sweets — served daily in Kano.">
  <link rel="icon" type="image/png" href="assets/img/rashko-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <div id="site-header-slot"></div>
  <main>
    <section class="section--page-hero">
      <div class="container-narrow">
        <span class="ornament eyebrow">À la Carte</span>
        <h1 class="display-xl mt-6">The Menu</h1>
        <p>Served daily, 11:00 — 23:00. Prices in Nigerian Naira. Many dishes are naturally vegetarian or can be adapted — please ask.</p>
        <a href="order.html" class="btn btn--accent" style="margin-top:2rem;border-radius:9999px;padding:0.75rem 1.5rem;letter-spacing:0.2em;">
          <span class="icon-inline" style="width:1rem;height:1rem;" data-icon="bag"></span>
          Start an Order
        </a>
      </div>
    </section>

    <div class="container-narrow" style="padding-block:6rem;" id="menu-root"></div>
  </main>
  <div id="site-footer-slot"></div>
  <div id="wa-float-slot"></div>
  <script src="assets/js/site.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const root = document.getElementById("menu-root");
      root.innerHTML = RashkoMenu.map(section => `
        <section class="menu-section">
          <header class="menu-section__head">
            <p class="eyebrow">${section.subtitle}</p>
            <h2 class="display-lg">${section.title}</h2>
          </header>
          <div class="menu-grid">
            ${section.items.map(d => `
              <article class="menu-item">
                <div class="menu-item__head">
                  <h3 class="menu-item__name">${d.name}</h3>
                  <span class="menu-item__dots"></span>
                  <span class="menu-item__price">${d.price}</span>
                </div>
                <p class="menu-item__desc">${d.desc}</p>
                <a class="menu-item__order" target="_blank" rel="noopener"
                   data-wa-message="Hello Rashko ({branch})! I'd like to order: ${d.name} (${d.price})." href="#">
                   <span class="icon-inline" style="width:0.875rem;height:0.875rem;" data-icon="whatsapp"></span>
                   Order on WhatsApp
                </a>
              </article>`).join("")}
          </div>
        </section>
      `).join("");
      hydrateIcons(root);
      refreshBranchUI();
    });
  </script>
</body>
</html>
